level = "collection"

# Open Bible Stories narration (OBS-TLF + unfoldingWord originals), per
# internal-docs/obs-narration-import-spec.md. Unlike OBS/John/TGS/DBS,
# this template holds no per-story .md content and no per-language
# audio_url/content_base_url — those are per-repo door43 facts that vary
# per language and are resolved live, not staged here (see languages.json
# for the one thing that IS staged: the iso -> door43 repo mapping).
#
# A client renders one story for one language by combining three things:
#   1. This template — the 50 canonical story ids/titles (locales/eng.toml)
#      and each language's door43 repo (languages.json).
#   2. door43 itself, live — GET {repo_raw_base}/{ingredients[0].path}/{story_id}.md
#      for text + image URLs (images use the shared unfoldingWord OBS art,
#      e.g. cdn.door43.org/obs/jpg/2160px/obs-en-{story_id}-{NN}.jpg —
#      already embedded as full URLs in that markdown, not reconstructed).
#      GET {repo_raw_base}/manifest.yaml for license/checking_level.
#      GET the repo's release asset list for the story's real audio_url
#      (naming is not a stable pattern across repos — read the actual
#      asset list, don't guess a filename).
#   3. audio-sync's published timing, live — GET
#      {timing.base_url}/{iso}/{story_id}_timing.json — a flat array of
#      {story, segment, timestamp, score, source}; segment_count is the
#      array length, not something this template pre-computes.

[door43]
raw_base_pattern = "https://git.door43.org/{full_name}/raw/branch/master"
# {full_name} comes from languages.json (e.g. "OBS-TLF/ahr_obs"). The
# content sub-path under raw_base is per-repo (manifest.yaml's
# ingredients[0].path) — not assumed to always be "content".

[timing]
base_url = "https://cdn.bibel.wiki/align/obs"
# {base_url}/{iso}/{story_id}_timing.json — public, unauthenticated.
# Published by audio-sync as languages are aligned; not every iso in
# languages.json has timing yet.

[license]
# Confirmed uniform across OBS-TLF repos (2026-07-31 spec investigation):
# CC BY-SA 4.0. checking_level varies per repo/language (self-reported,
# see manifest.yaml) — read it live per language, not assumed here.
default = "CC BY-SA 4.0"

story_count = 50
