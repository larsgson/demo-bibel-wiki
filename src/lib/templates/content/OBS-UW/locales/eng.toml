# Just the book-level title — feeds the page <title> tag
# (props.engLocale?.bookTitle in [template]/[...path].astro) — nothing else.
# The 50 per-story titles this file used to carry are gone: they're now
# fully superseded by cdn.bibel.wiki's own live, per-language title
# resolution (media.json's stories[id].title, covering English too — see
