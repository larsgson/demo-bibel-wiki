# Videos (YouTube), per language in locales/<iso>.toml — shown behind an
# audio/video toggle on the story page, audio being the default:
#   video_url = "…"            top level: one film for the whole Gospel;
#                              used for a story only where that story gives
#                              its start in it:
#   [01.05]
#   video_start = 1234         seconds into the film (video_end optional)
#   video_url = "…"            or: a video of this story alone
# See src/lib/bw/story-video.ts (localeStoryVideo). English, French and
# Spanish have the Jesus Film Project's full film with per-story times (its
# French/Spanish audio tracks can only be picked in YouTube's own settings
# menu); the other locales' links were all unavailable on YouTube as of
# 2026-10-27.
