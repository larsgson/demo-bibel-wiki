# ── Region landing page (/r/zm) ──────────────────────────────────────────────
# TODO: heroImage — no photo sourced yet (see mx-hero.jpg / id-hero.jpg for
# the pattern: a free-to-use Unsplash photo + heroCredit). Landing page falls
# back to a plain accent-color background until one is added.
#
# Not marked unlisted: unlike za.toml (the ONLY resolved language was the
# colonial trade language, zero indigenous resolution), 6 genuine indigenous
# Zambian languages resolve here, plus Nyanja (a real, non-colonial national
# lingua franca) has full NT+OT — a meaningfully stronger base than za.toml's
# disqualifying case, even though the raw percentage (6/32) is similar.

[landing]
accentColor = "#198A00"   # Zambia flag green
headline = { en = "The Bible in the languages of Zambia" }
subhead  = { en = "Read and listen to Scripture in Zambia's regional languages." }

# ── Picker "this region" tier ────────────────────────────────────────────────

[picker]
tierLabel = { en = "Languages of Zambia" }
filterBy = "province"   # which grouping powers the picker filter chips

# ── Study + SEO ──────────────────────────────────────────────────────────────
# defaultLanguage (nya) is not in the fixed study-mode gate list (arb asm ben
# eng fra hau hin por rus spa; see src/lib/bw/study-languages.ts), so Zambia
# hits the same kind of gap za.toml documents — UNLIKE za.toml, though, eng
# IS on that list and is already surfaced here as the other trade language,
# so selecting it unlocks Study mode. defaultStudyLanguage is set to eng, not
# nya.

[study]
defaultStudyLanguage = "eng"

[seo]
host = "zm.demo.bibel.wiki"
