# Mexico — regional entry point.   Subdomain: mx.bibel.wiki   ·   Path: /r/mx
#
# Single source of truth for the region (replaces config/regions.conf). Drives
# the region landing page, the picker, and any sub-region subdomains.
# Add a sibling file (se.toml, in.toml, …) for each new top-level region.

code = "mx"
name = { en = "Mexico", es = "México" }
title = { en = "Your Mexican Bible", es = "Tu Biblia mexicana" }  # header title; hidden if unset
defaultLanguage = "spa"   # primary language when entering with none chosen
uiLanguage = "es"         # entering this region DEFAULTS the UI to Spanish

# Bridge/trade languages — surfaced first; natural audio/study fallback.
tradeLanguages = ["spa"]

# Every language in this region (ISO 639-3).
languages = [
  "amu", "azd", "azg", "azz", "cco", "chd", "chf", "chq", "chz", "cle",
  "cnl", "cnt", "cok", "cpa", "cso", "cta", "ctp", "ctu", "cuc", "cut",
  "cux", "hch", "huv", "jmx", "knj", "lac", "maj", "maq", "mau", "maz",
  "mbz", "mco", "mdv", "meh", "mfy", "mie", "mig", "mih", "mil", "mim",
  "mio", "mir", "mit", "miy", "miz", "mjc", "mks", "mix", "mpm", "mto",
  "mxb", "mxq", "mxt", "mxv", "mza", "nch", "ncj", "ncl", "ngu", "nhe",
  "nhg", "nhi", "nhw", "nhy", "npl", "nsu", "ntp", "nuz", "ood", "otm",
  "otn", "otq", "ots", "pls", "pmq", "poe", "poi", "pps", "stp", "tac",
  "tcf", "tee", "tku", "toc", "toj", "too", "tos", "tpl", "tpp", "tpt",
  "tpx", "tqt", "trc", "trq", "trs", "var", "vmj", "vmy", "vmz", "xta",
  "xtd", "xtj", "xtn", "yaq", "zaa", "zab", "zac", "zad", "zai", "zam",
  "zao", "zaq", "zar", "zas", "zat", "zav", "zaw", "zca", "zos", "zpc",
  "zpg", "zpi", "zpl", "zpm", "zpo", "zpq", "zpt", "zpu", "zpv", "zpz",
  "zsr", "ztl", "ztp", "ztq", "zts", "zty",
]

# ── Groupings ────────────────────────────────────────────────────────────────
# Two kinds, by the `navigable` flag:
#   navigable = false → a picker FILTER for language selection (no URL).
#                       Auto-generated and ACTIVE.
#   navigable = true  → a sub-region SUBDOMAIN  mx.<slug>.bibel.wiki  (hierarchical).
#                       ALWAYS generated COMMENTED-OUT — uncomment a group to make
#                       its subdomain valid. Never auto-enabled.

# --- By state (picker filter; active) ---
# "By language family" (below, commented out) had 32 groups, 14 of them
# singletons — an unusably long trail of one-language chips as the DEFAULT
# picker view (same problem id.toml hit and solved the same way — see its
# own "By island" comment). "By state" groups more evenly.
[[grouping]]
id = "state"
navigable = false
name = { en = "By state", es = "Por estado" }

  [[grouping.group]]
  slug = "oaxaca"
  name = { en = "Oaxaca", es = "Oaxaca" }
