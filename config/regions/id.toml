# ── Groupings ────────────────────────────────────────────────────────────────
# Two kinds, by the `navigable` flag:
#   navigable = false → a picker FILTER for language selection (no URL).
#                       Auto-generated and ACTIVE.
#   navigable = true  → a sub-region SUBDOMAIN  id.<slug>.bibel.wiki  (hierarchical).
#                       ALWAYS generated COMMENTED-OUT — uncomment a group to make
#                       its subdomain valid. Never auto-enabled.
#
# Only ONE grouping is ever rendered (whichever `[picker].filterBy` names) —
# see src/pages/r/[region]/index.astro and useLanguageSearch.ts. The other
# groupings below are reference data, ready to promote later.
#
# Indonesia has ~700 languages across 6 major islands/archipelagos, so unlike
# Mexico's mx.toml (where "by family" is the intuitive, well-known grouping
# to a Mexican audience), a 52-way linguistic-family breakdown here would be
# unusably granular as the DEFAULT picker view. "By island" (7 groups) is
# the primary filter instead — geography is the intuitive axis for a general
# audience. "By language family" is kept as commented reference data (same
# treatment as "by province") in case a future UI adds a family-view toggle.

# --- By island (picker filter; active) ---
[[grouping]]
id = "island"
navigable = false
name = { en = "By island", id = "Berdasarkan pulau" }

  [[grouping.group]]
