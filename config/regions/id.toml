# Indonesia — regional entry point.   Subdomain: id.demo.bibel.wiki   ·   Path: /r/id
#
# Single source of truth for the region (mirrors config/regions/mx.toml).
# Drives the region landing page, the picker, and any sub-region subdomains.
#
# Scope note: this is NOT "every language of Indonesia" (there are ~700).
# It's the intersection of Indonesia-tagged ISO 639-3 codes (Wikidata
# P17=Indonesia) against the three content sources this app actually draws
# from — PKF (cdn.bibel.wiki), DBT/Bible Brain (cdn.bibel.wiki media index),
# and helloAO (bible.helloao.org) — so every language listed here has at
# least one real fileset behind it. See config/regions/id-languages.tsv for
# the per-language family/province classification (Glottolog + OSM reverse
# geocoding) this file was generated from.

code = "id"
name = { en = "Indonesia", id = "Indonesia" }
title = { en = "Your Indonesian Bible", id = "Alkitab Anda dalam Bahasa Indonesia" }  # header title; hidden if unset
defaultLanguage = "ind"   # primary language when entering with none chosen
uiLanguage = "id"         # entering this region DEFAULTS the UI to Indonesian
                          # (src/locales/id.ts) — the region-landing template
                          # reads Localized.[uiLanguage] generically, so any
                          # registered locale works here, not just en/es.

# Bridge/trade language — surfaced first; natural audio/study fallback.
tradeLanguages = ["ind"]

# Every language in this region (ISO 639-3). 139 languages — see the scope
# note above for why this isn't exhaustive.
languages = [
  "aau", "aaz", "abs", "ace", "akb", "alp", "amk", "aoz", "atq", "auu",
  "awu", "ayz", "ban", "bbc", "bep", "beu", "bgz", "bhp", "bhw", "bhz",
  "bkl", "blz", "btd", "bth", "bts", "btx", "bug", "bvz", "dna", "dni",
  "dnt", "dnw", "eip", "ekg", "emb", "eno", "frd", "gbi", "gef", "gor",
  "had", "hap", "heg", "hvn", "iba", "jav", "jmd", "kgr", "kjc", "kje",
  "kkl", "kli", "klw", "kmt", "kpq", "kvo", "kzf", "law", "lbw", "lew",
