# ── Region landing page (/r/za) ──────────────────────────────────────────────
# TODO: heroImage — no photo sourced yet (see mx-hero.jpg / id-hero.jpg for
# the pattern: a free-to-use Unsplash photo + heroCredit). Landing page falls
# back to a plain accent-color background until one is added.
#
# unlisted = true: hidden from the "/" homepage grid + search until content
# coverage improves (see the scope note at the top of this file — only 1 of
# 12 languages currently resolves to real text). Still fully reachable at
# /r/za/ and via the za.demo.bibel.wiki redirect. Remove once nso/tso (or
# more) become resolvable, or whenever this is otherwise ready to promote.

[landing]
unlisted = true
accentColor = "#007749"
headline = { en = "The Bible in the languages of South Africa" }
subhead  = { en = "Read and listen to Scripture in South Africa's regional languages." }

# ── Picker "this region" tier ────────────────────────────────────────────────

[picker]
tierLabel = { en = "Languages of South Africa" }
filterBy = "family"   # which grouping powers the picker filter chips

# ── Study + SEO ──────────────────────────────────────────────────────────────
# defaultStudyLanguage is "eng", not a South African language — none of the
# 12 listed above are in the fixed study-mode gate list (arb asm ben eng fra
# hau hin por rus spa; see src/lib/bw/study-languages.ts), so any of them
# would fail to satisfy study mode's "≥1 selected language" requirement.

[study]
defaultStudyLanguage = "eng"

[seo]
host = "za.demo.bibel.wiki"
