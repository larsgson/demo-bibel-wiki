# ── Region landing page (/r/ml) ──────────────────────────────────────────────
# TODO: heroImage — no photo sourced yet (see mx-hero.jpg / id-hero.jpg for
# the pattern: a free-to-use Unsplash photo + heroCredit). Landing page falls
# back to a plain accent-color background until one is added.
#
# Not marked unlisted: 18 of 61 indigenous languages resolve to real content
# (29.5%), plus both bridge languages (bam, fra) have full NT+OT — a
# meaningfully more substantial base than za.toml's 1-of-12 (where the ONLY
# resolved language was a bridge language and zero indigenous South African
# languages had real content). Closer to cas.toml's 7-of-16 (44%, also not
# unlisted) than to za.toml's case. Revisit if this judgment looks wrong.

[landing]
accentColor = "#14B53A"   # Mali flag green (flag is green/gold/red)
headline = { en = "The Bible in the languages of Mali", fr = "La Bible dans les langues du Mali" }
subhead  = { en = "Read and listen to Scripture in Mali's regional languages.", fr = "Lisez et écoutez les Écritures dans les langues régionales du Mali." }

# ── Picker "this region" tier ────────────────────────────────────────────────

[picker]
tierLabel = { en = "Languages of Mali", fr = "Langues du Mali" }
filterBy = "family"   # which grouping powers the picker filter chips

# ── Study + SEO ──────────────────────────────────────────────────────────────
# defaultLanguage (bam) is NOT in the fixed study-mode gate list (arb asm
# ben eng fra hau hin por rus spa; see src/lib/bw/study-languages.ts), so
# Mali does hit a smaller version of za.toml's gap — UNLIKE za.toml, though,
# fra IS on that list and is already surfaced here as the other trade
# language, so selecting it (instead of, or alongside, bam) unlocks Study
# mode. defaultStudyLanguage is set to fra, not bam.

[study]
defaultStudyLanguage = "fra"

[seo]
host = "ml.demo.bibel.wiki"
