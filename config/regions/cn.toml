# ── Region landing page (/r/cn) ──────────────────────────────────────────────
# TODO: heroImage — no photo sourced yet (see mx-hero.jpg / id-hero.jpg for
# the pattern: a free-to-use Unsplash photo + heroCredit). Landing page falls
# back to a plain accent-color background until one is added.
#
# Not marked unlisted: all 35 listed languages resolve to real content
# (100% — better coverage than za.toml's 1/12 or cas.toml's 7/16), and the
# default language (cmn) has full NT+OT, so this is ready to promote on the
# homepage like mx/id/ke/cas.

[landing]
accentColor = "#DE2910"
headline = { en = "The Bible in the languages of China", zh = "中国各民族语言的圣经" }
subhead  = { en = "Read and listen to Scripture in China's regional and minority languages.", zh = "阅读并聆听中国各地区和少数民族语言的圣经。" }

# ── Picker "this region" tier ────────────────────────────────────────────────

[picker]
tierLabel = { en = "Languages of China", zh = "中国的语言" }
filterBy = "family"   # which grouping powers the picker filter chips

# ── Study + SEO ──────────────────────────────────────────────────────────────
# defaultStudyLanguage is "eng", not a Chinese/PRC-indigenous language — none
# of cmn/yue/nan/hak/etc. above are in the fixed study-mode gate list (arb
# asm ben eng fra hau hin por rus spa; see src/lib/bw/study-languages.ts),
# same gap za.toml documents for South Africa. NOTE, unlike za.toml's total
# gap: Portuguese (por) IS both in this file's `languages` list (Macau) AND
# in the study-mode gate list — technically available, just not used as the
# default given how marginal Macau's population is relative to the whole
# region. Worth reconsidering if this region ever gets a more representative
# study-capable language.

[study]
defaultStudyLanguage = "eng"

[seo]
host = "cn.demo.bibel.wiki"
