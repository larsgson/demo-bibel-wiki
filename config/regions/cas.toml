# ── Region landing page (/r/cas) ─────────────────────────────────────────────
# TODO: heroImage — no photo sourced yet (see mx-hero.jpg / id-hero.jpg for
# the pattern: a free-to-use Unsplash photo + heroCredit). Landing page falls
# back to a plain accent-color background until one is added.

[landing]
accentColor = "#0099CC"
headline = { en = "The Bible in the languages of Central Asia", ru = "Библия на языках Центральной Азии" }
subhead  = { en = "Read and listen to Scripture in Central Asia's regional languages.", ru = "Читайте и слушайте Писание на языках народов Центральной Азии." }

# ── Picker "this region" tier ────────────────────────────────────────────────

[picker]
tierLabel = { en = "Languages of Central Asia", ru = "Языки Центральной Азии" }
filterBy = "country"   # which grouping powers the picker filter chips

# ── Study + SEO ──────────────────────────────────────────────────────────────
# Unlike za.toml, rus IS in the fixed study-mode gate list (arb asm ben eng
# fra hau hin por rus spa; see src/lib/bw/study-languages.ts), so the actual
# regional default language also works for study mode.

[study]
defaultStudyLanguage = "rus"

[seo]
host = "cas.demo.bibel.wiki"
