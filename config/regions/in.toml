# ── Region landing page (/r/in) ──────────────────────────────────────────────
# TODO: heroImage — no photo sourced yet (see mx-hero.jpg / id-hero.jpg for
# the pattern: a free-to-use Unsplash photo + heroCredit). Landing page falls
# back to a plain accent-color background until one is added.
#
# Not marked unlisted: 99 languages resolve, including 16 of the 22
# constitutionally scheduled languages with full or near-full text coverage
# — by far the strongest content base of any region file here, comparable
# to mx.toml/id.toml rather than the thinner za.toml/zm.toml cases.
#
[landing]
accentColor = "#FF9933"   # India flag saffron
headline = { en = "The Bible in the languages of India", hi = "भारत की भाषाओं में बाइबिल" }
subhead  = { en = "Read and listen to Scripture in India's regional languages.", hi = "भारत की क्षेत्रीय भाषाओं में पवित्रशास्त्र पढ़ें और सुनें।" }

# ── Picker "this region" tier ────────────────────────────────────────────────

[picker]
tierLabel = { en = "Languages of India", hi = "भारत की भाषाएँ" }
filterBy = "state"   # which grouping powers the picker filter chips

# ── Study + SEO ──────────────────────────────────────────────────────────────
# defaultLanguage (eng) IS in the fixed study-mode gate list (arb asm ben
# eng fra hau hin por rus spa; see src/lib/bw/study-languages.ts) — no gap
# to document here. Worth noting Hindi (hin) is ALSO on that list — a
# visitor who selects it as a secondary language unlocks Study mode too,
# same as everyone else, just not specially defaulted to it.

[study]
defaultStudyLanguage = "eng"

[seo]
host = "in.demo.bibel.wiki"
