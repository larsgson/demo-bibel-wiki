# ── Region landing page (/r/ke) ──────────────────────────────────────────────
# TODO: heroImage — no photo sourced yet (see mx-hero.jpg / id-hero.jpg for
# the pattern: a free-to-use Unsplash photo + heroCredit). Landing page falls
# back to a plain accent-color background until one is added.

[landing]
accentColor = "#006600"
headline = { en = "The Bible in the languages of Kenya", sw = "Biblia katika lugha za Kenya" }
subhead  = { en = "Read and listen to Scripture in Kenya's regional languages.", sw = "Soma na usikilize Maandiko katika lugha za mikoa ya Kenya." }

# ── Picker "this region" tier ────────────────────────────────────────────────

[picker]
tierLabel = { en = "Languages of Kenya", sw = "Lugha za Kenya" }
filterBy = "province"   # which grouping powers the picker filter chips

# ── Study + SEO ──────────────────────────────────────────────────────────────

[study]
defaultStudyLanguage = "swh"
