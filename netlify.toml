[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  # These are public base URLs, not credentials (see comments below on each) —
  # Netlify's secret scanner still flags them because their values happen to
  # match a configured env var. Exempt them explicitly rather than disabling
  # the scanner outright.
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_PKF_BASE_URL,PUBLIC_API_BASE_URL,DBT_API_BASE_URL"
  # Public CDN host for PKF/DBT scripture data (see src/lib/bw/pkf-url.ts).
  # Not a secret — already inlined into the client bundle. Without it,
  # scripts/fetch-data.mjs falls back to downloading the full data tarball
  # from the GitHub release, which the release no longer publishes (data
  # delivery moved to the CDN) — that fallback fails the build.
  PUBLIC_PKF_BASE_URL = "https://cdn.bibel.wiki"
  # DBT/Bible Brain API base — not a secret (only DBT_API_KEY is). Without
  # it, netlify/functions/dbt-proxy.cjs builds `new URL("undefined/bibles/...")`
  # and throws "Invalid URL" on every request — the live symptom that surfaced
  # this. DBT_API_KEY itself must still be set via the Netlify dashboard (it's
  # not committed here), same as today.
  DBT_API_BASE_URL = "https://4.dbt.io/api"

[dev]
  framework = "astro"
  port = 8888
  functionsPort = 9999

[functions]
  directory = "netlify/functions"

# Regional entry-point subdomains (see config/regions/*.toml, `seo.host`).
# Domain-scoped redirects — only match requests to that specific host, so
# they don't affect the primary demo.bibel.wiki domain. Add one line per
# region subdomain once its config/regions/<code>.toml exists.
#
# The scheme (https://) is REQUIRED for Netlify to treat `from` as a host
# match instead of a literal (unmatchable) path — a bare domain here is
# silently a no-op, which is exactly what shipped and shadowed the region
# landing pages on both subdomains until this fix.
[[redirects]]
  from = "https://mx.demo.bibel.wiki/"
  to = "/r/mx/"
  status = 200
  force = true

[[redirects]]
  from = "https://id.demo.bibel.wiki/"
  to = "/r/id/"
  status = 200
  force = true

